[project]
name = "aquarela"
version = "0.0.2"
description = "Open source data labeling tool. Paint, draw and label freely."
readme = "README.md"
license = "MIT"
authors = [{ name = "Percy Cubas" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
aquarela = "aquarela.app:main"

[project.urls]
Homepage = "https://github.com/aquarelahq/aquarela"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
